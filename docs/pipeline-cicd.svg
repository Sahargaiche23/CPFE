<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e11d48"/>
      <stop offset="100%" style="stop-color:#be123c"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">Pipeline CI/CD GitHub Actions</text>
  
  <!-- Step 1 -->
  <rect x="30" y="60" width="100" height="80" rx="8" fill="white" stroke="#e11d48" stroke-width="2"/>
  <circle cx="80" cy="80" r="14" fill="#e11d48"/>
  <text x="80" y="85" text-anchor="middle" fill="white" font-size="12" font-weight="bold">1</text>
  <text x="80" y="110" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">Git Push</text>
  <text x="80" y="125" text-anchor="middle" fill="#64748b" font-size="9">main/develop</text>
  
  <!-- Arrow 1 -->
  <path d="M135 100 L155 100" stroke="#e11d48" stroke-width="2" fill="none"/>
  <polygon points="160,100 150,95 150,105" fill="#e11d48"/>
  
  <!-- Step 2 -->
  <rect x="165" y="60" width="100" height="80" rx="8" fill="white" stroke="#e11d48" stroke-width="2"/>
  <circle cx="215" cy="80" r="14" fill="#e11d48"/>
  <text x="215" y="85" text-anchor="middle" fill="white" font-size="12" font-weight="bold">2</text>
  <text x="215" y="110" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">Build & Test</text>
  <text x="215" y="125" text-anchor="middle" fill="#64748b" font-size="9">Gradle + npm</text>
  
  <!-- Arrow 2 -->
  <path d="M270 100 L290 100" stroke="#e11d48" stroke-width="2" fill="none"/>
  <polygon points="295,100 285,95 285,105" fill="#e11d48"/>
  
  <!-- Step 3 -->
  <rect x="300" y="60" width="100" height="80" rx="8" fill="white" stroke="#e11d48" stroke-width="2"/>
  <circle cx="350" cy="80" r="14" fill="#e11d48"/>
  <text x="350" y="85" text-anchor="middle" fill="white" font-size="12" font-weight="bold">3</text>
  <text x="350" y="110" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">SonarQube</text>
  <text x="350" y="125" text-anchor="middle" fill="#64748b" font-size="9">Quality Gate</text>
  
  <!-- Arrow 3 -->
  <path d="M405 100 L425 100" stroke="#e11d48" stroke-width="2" fill="none"/>
  <polygon points="430,100 420,95 420,105" fill="#e11d48"/>
  
  <!-- Step 4 -->
  <rect x="435" y="60" width="100" height="80" rx="8" fill="white" stroke="#e11d48" stroke-width="2"/>
  <circle cx="485" cy="80" r="14" fill="#e11d48"/>
  <text x="485" y="85" text-anchor="middle" fill="white" font-size="12" font-weight="bold">4</text>
  <text x="485" y="110" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">Docker Build</text>
  <text x="485" y="125" text-anchor="middle" fill="#64748b" font-size="9">15 images</text>
  
  <!-- Arrow 4 -->
  <path d="M540 100 L560 100" stroke="#e11d48" stroke-width="2" fill="none"/>
  <polygon points="565,100 555,95 555,105" fill="#e11d48"/>
  
  <!-- Step 5 -->
  <rect x="570" y="60" width="100" height="80" rx="8" fill="white" stroke="#e11d48" stroke-width="2"/>
  <circle cx="620" cy="80" r="14" fill="#e11d48"/>
  <text x="620" y="85" text-anchor="middle" fill="white" font-size="12" font-weight="bold">5</text>
  <text x="620" y="110" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">Push Registry</text>
  <text x="620" y="125" text-anchor="middle" fill="#64748b" font-size="9">ghcr.io</text>
  
  <!-- Arrow 5 -->
  <path d="M675 100 L695 100" stroke="#e11d48" stroke-width="2" fill="none"/>
  <polygon points="700,100 690,95 690,105" fill="#e11d48"/>
  
  <!-- Step 6 -->
  <rect x="705" y="60" width="80" height="80" rx="8" fill="url(#grad-primary)"/>
  <circle cx="745" cy="80" r="14" fill="white"/>
  <text x="745" y="85" text-anchor="middle" fill="#e11d48" font-size="12" font-weight="bold">6</text>
  <text x="745" y="110" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Deploy</text>
  <text x="745" y="125" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Kubernetes</text>
  
  <!-- Branches info -->
  <rect x="30" y="160" width="360" height="30" rx="6" fill="#dbeafe"/>
  <text x="210" y="180" text-anchor="middle" fill="#1d4ed8" font-size="10">develop → Staging (auto) | main → Production (approval)</text>
</svg>
