<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="mon-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="mon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="mon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="250" fill="#1e293b" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Stack Monitoring &amp; Logging</text>
  
  <!-- Metrics Section -->
  <rect x="20" y="50" width="370" height="180" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="205" y="75" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="11">METRIQUES</text>
  
  <rect x="40" y="95" width="100" height="55" rx="6" fill="url(#mon-orange)"/>
  <text x="90" y="120" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Prometheus</text>
  <text x="90" y="137" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Scraping</text>
  
  <!-- Arrow -->
  <path d="M145 122 L175 122" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <polygon points="180,122 170,117 170,127" fill="rgba(255,255,255,0.5)"/>
  
  <rect x="185" y="95" width="100" height="55" rx="6" fill="url(#mon-green)"/>
  <text x="235" y="120" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Alertmanager</text>
  <text x="235" y="137" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Alertes</text>
  
  <!-- Arrow -->
  <path d="M140 155 L140 175 L235 175 L235 190" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <polygon points="235,195 230,185 240,185" fill="rgba(255,255,255,0.5)"/>
  
  <rect x="135" y="170" width="200" height="50" rx="6" fill="url(#mon-blue)"/>
  <text x="235" y="195" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Grafana</text>
  <text x="235" y="212" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Dashboards</text>
  
  <!-- Logs Section -->
  <rect x="410" y="50" width="370" height="180" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="595" y="75" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="11">LOGS</text>
  
  <rect x="430" y="95" width="100" height="55" rx="6" fill="url(#mon-purple)"/>
  <text x="480" y="120" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Promtail</text>
  <text x="480" y="137" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Collecte</text>
  
  <!-- Arrow -->
  <path d="M535 122 L565 122" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <polygon points="570,122 560,117 560,127" fill="rgba(255,255,255,0.5)"/>
  
  <rect x="575" y="95" width="100" height="55" rx="6" fill="url(#mon-orange)"/>
  <text x="625" y="120" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Loki</text>
  <text x="625" y="137" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Stockage</text>
  
  <!-- Arrow -->
  <path d="M530 155 L530 175 L625 175 L625 190" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <polygon points="625,195 620,185 630,185" fill="rgba(255,255,255,0.5)"/>
  
  <rect x="525" y="170" width="200" height="50" rx="6" fill="url(#mon-blue)"/>
  <text x="625" y="195" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Grafana</text>
  <text x="625" y="212" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Visualisation</text>
</svg>
