server:
  port: 8081

documents:
  upload:
    path: /tmp/cnss-documents

spring:
  application:
    name: employer-service
  codec:
    max-in-memory-size: 50MB
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    parser:
      allow-comments: true
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: COPT
    password: copt123
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

# URLs des services internes (utiliser noms Docker ou host.docker.internal)
auth.service.url: ${AUTH_SERVICE_URL:http://host.docker.internal:8089}
notification.service.url: ${NOTIFICATION_SERVICE_URL:http://host.docker.internal:8087}
